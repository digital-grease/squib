# Copy of the recipe kept in F-Droid's fdroiddata repository (metadata/dev.digitalgrease.squib.yml).
# The submitted copy drops these four comment lines and replaces each `commit: vX.Y.Z` with the
# full hash of that tag. The store listing itself is read from fastlane/metadata/android in this
# repository; see fdroid/README.md.
AntiFeatures:
  NonFreeNet:
    en-US: The optional range-conditions lookups use US government web services (aviationweather.gov
      for METAR weather reports, api.weather.gov for weather alerts and epqs.nationalmap.gov
      (USGS) for terrain elevation). Both switches are off by default; everything
      else works offline.
Categories:
  - Sports & Health
  - Timer
License: AGPL-3.0-or-later
AuthorName: digital-grease
AuthorEmail: dg@digitalgrease.net
WebSite: https://github.com/digital-grease/squib
SourceCode: https://github.com/digital-grease/squib
IssueTracker: https://github.com/digital-grease/squib/issues
Donate: https://www.buymeacoffee.com/digitalgrease

AutoName: Squib

RepoType: git
Repo: https://github.com/digital-grease/squib.git

Builds:
  - versionName: 0.1.2
    versionCode: 1022
    commit: v0.1.2
    subdir: apps/android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential
    gradle:
      - yes
    srclibs:
      - rustup@1.28.2
    prebuild:
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain none
      - cd ../../.. && $HOME/.cargo/bin/rustup toolchain install
      - $HOME/.cargo/bin/cargo install cargo-ndk --version 4.1.2 --locked
    build:
      - export PATH=$HOME/.cargo/bin:$PATH
      - bash ../../../scripts/build-android-core.sh release arm64-v8a
    ndk: r28c
    gradleprops:
      - squibSkipRust=true
      - squibAbi=arm64-v8a

