name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core and replay corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Replay corpus (synthetic fixtures, hash-checked)
        run: |
          cargo build --release --locked -p squib-replay
          ./target/release/squib-replay corpus fixtures/synthetic

  swift:
    name: Swift bindings and SquibKit against the Linux core
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: swift
      - name: Build and test in the pinned Swift container
        # Checks the generated Swift and the par-timer model with the real core (ADR-065);
        # the iOS simulator run is the iOS workflow.
        run: ./scripts/swift-linux-test.sh

  android:
    name: Android debug and release builds
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Assemble debug APK
        working-directory: apps/android
        # scripts/build-android-core.sh resolves the pinned NDK under $ANDROID_HOME.
        run: ./gradlew :app:assembleDebug
      - name: Assemble minified release APK (unsigned)
        working-directory: apps/android
        # R8 with the keep rules in app/proguard-rules.pro. CI has no signing material, so the
        # APK is unsigned; it is checked, not uploaded (signed builds come from release.yml).
        run: |
          ./gradlew :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libsquib_mobile.so"
          unzip -l "$apk" | grep -q "lib/x86_64/libsquib_mobile.so"
          ls -l "$apk"
      - name: Third-party notices are current
        # The About screen's licence notices are generated from the Rust and Android
        # dependency graphs; a dependency change must regenerate them.
        run: python3 scripts/third_party_notices.py --check

