name: Release

# Builds the signed release APK for a version tag and attaches it to a draft GitHub Release.
# The owner reviews the draft and publishes it by hand. F-Droid builds from source and signs
# with its own key, so nothing here is needed for the F-Droid submission.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag, versions and changelog agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # squibVersion in build.gradle.kts is the single source (ADR-058); the tag, the Rust
          # workspace version, the F-Droid draft and the fastlane changelog must all match it.
          version=$(sed -n 's/^val squibVersion = "\(.*\)"$/\1/p' apps/android/app/build.gradle.kts)
          test -n "$version" || { echo "::error::squibVersion not found in build.gradle.kts"; exit 1; }
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          literal_code=$(sed -n 's/^val squibVersionCode = \([0-9]*\)$/\1/p' apps/android/app/build.gradle.kts)
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          fail=0
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match squibVersion $version"; fail=1; }
          [ "$literal_code" = "$code" ] || { echo "::error::squibVersionCode $literal_code does not match squibVersion $version (expected $code)"; fail=1; }
          [ "$cargo_version" = "$version" ] || { echo "::error::Cargo.toml workspace version $cargo_version does not match $version"; fail=1; }
          grep -q "^CurrentVersion: $version$" fdroid/dev.digitalgrease.squib.yml || { echo "::error::fdroid recipe CurrentVersion is not $version"; fail=1; }
          grep -q "^CurrentVersionCode: $((code * 10 + 3))$" fdroid/dev.digitalgrease.squib.yml || { echo "::error::fdroid recipe CurrentVersionCode is not $((code * 10 + 3))"; fail=1; }
          # F-Droid builds one APK per ABI with code*10 + 2 (arm64-v8a) and code*10 + 3 (x86_64),
          # and reads each APK's changelog by its own code.
          for c in "$code" "$((code * 10 + 2))" "$((code * 10 + 3))"; do
            test -s "fastlane/metadata/android/en-US/changelogs/$c.txt" || { echo "::error::fastlane changelog $c.txt is missing"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  core:
    name: Rust core tests
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --workspace --locked
      - name: Replay corpus (synthetic fixtures, hash-checked)
        run: |
          cargo build --release --locked -p squib-replay
          ./target/release/squib-replay corpus fixtures/synthetic

  build:
    name: Signed release APK
    runs-on: ubuntu-latest
    needs: [gate, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Decode the release keystore
        # Read from the environment, not interpolated into the script; written outside the
        # workspace and removed at the end of the job.
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          python3 -c "import base64, os; open(os.environ['RUNNER_TEMP'] + '/squib-release.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64']))"
      - name: Assemble signed release APK
        working-directory: apps/android
        env:
          SQUIB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SQUIB_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SQUIB_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export SQUIB_KEYSTORE="$RUNNER_TEMP/squib-release.jks"
          ./gradlew :app:assembleRelease
      - name: Check the signature and contents
        working-directory: apps/android
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          # The expected certificate fingerprint is a repository variable, so a substituted
          # keystore secret cannot produce a release that passes.
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          test -n "$EXPECTED_CERT_SHA256" || { echo "::error::RELEASE_CERT_SHA256 variable is not set"; exit 1; }
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          echo "$certs"
          actual=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')
          expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          [ "$actual" = "$expected" ] || { echo "::error::APK certificate $actual does not match RELEASE_CERT_SHA256"; exit 1; }
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libsquib_mobile.so"
          unzip -l "$apk" | grep -q "lib/x86_64/libsquib_mobile.so"
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Name the release files
        working-directory: apps/android
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/squib-$TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/out/squib-$TAG-mapping.txt"
          cd "$RUNNER_TEMP/out" && sha256sum "squib-$TAG.apk" > "squib-$TAG.apk.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/squib-release.jks"

  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [gate, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Squib ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: fastlane/metadata/android/en-US/changelogs/${{ needs.gate.outputs.code }}.txt
          # The R8 mapping stays a workflow artifact for deobfuscating reports; it is not a
          # release download.
          files: |
            out/squib-${{ github.ref_name }}.apk
            out/squib-${{ github.ref_name }}.apk.sha256
